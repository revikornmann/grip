# Update Muka UI — consumer workflow
#
# muka-ui's publish pipeline publishes a new version to GitHub Packages on every
# release, then fires a `muka-released` repository_dispatch (carrying the
# version) to each repo in muka's .github/consumers.txt. This workflow receives
# that dispatch, installs the exact published version, and commits the lockfile
# bump. Pushing to the default branch lets Vercel redeploy with the new version.

name: Update Muka UI

on:
  repository_dispatch:
    types: [muka-released]
  workflow_dispatch:

concurrency:
  group: update-muka-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@revikornmann'

      - name: Install target Muka version
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          npm install "@revikornmann/muka-ui@${VERSION:-latest}" --save
        env:
          # muka-ui is a private package. GITHUB_TOKEN only works if this repo is
          # granted read access to the package; otherwise set MUKA_PACKAGES_TOKEN
          # (a PAT with read:packages) as a repo secret.
          NODE_AUTH_TOKEN: ${{ secrets.MUKA_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already on the target muka version — nothing to update."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "muka updated — will commit lockfile."
          fi

      - name: Commit and push update
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json package-lock.json
          git commit -m "chore(deps): update @revikornmann/muka-ui to ${{ github.event.client_payload.version || 'latest' }}

          Triggered by: ${{ github.event_name }}
          Source muka commit: ${{ github.event.client_payload.source_sha }}"
          git push

      - name: Summary
        if: always()
        run: |
          echo "## Muka update" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Trigger:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Target version:** ${{ github.event.client_payload.version || 'latest' }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.changes.outputs.changed }}" == "true" ]; then
            echo "Status: updated and pushed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Status: already up to date" >> "$GITHUB_STEP_SUMMARY"
          fi
